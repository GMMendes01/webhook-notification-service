services:
  postgres:
    image: postgres:16-alpine
    container_name: webhook-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: webhookdb
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
    volumes:
      - webhook_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhookdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: webhook-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    container_name: webhook-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI: http://localhost:8025

volumes:
  webhook_pg_data:
