spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: localhost
    port: 1025

webhook:
  dispatcher:
    # Tests call DispatchService explicitly instead of relying on the scheduler.
    enabled: false
    interval-ms: 100000
    batch-size: 50
    lock-ttl-seconds: 30
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
  retry:
    max-attempts: 3
    base-delay-seconds: 0
    max-delay-seconds: 0
  idempotency:
    ttl-hours: 1

logging:
  level:
    br.com.portfolio.webhook: DEBUG
